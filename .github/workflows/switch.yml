name: Switch

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: switch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nro:
    name: Nintendo Switch .nro
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ccache zip

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="1.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The generated units are most of the build; ccache keeps unchanged ones.
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: switch-ccache-${{ hashFiles('lcs/generated/**', 'include/**') }}-${{ github.sha }}
          restore-keys: |
            switch-ccache-${{ hashFiles('lcs/generated/**', 'include/**') }}-
            switch-ccache-

      - name: Build
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 3G
          CCACHE_COMPRESS: "1"
          LCS_SWITCH_VERSION: ${{ steps.version.outputs.version }}
        run: |
          lcs/switch/build.sh
          ccache --show-stats || true

      - name: Zip
        shell: bash
        run: |
          cd out/switch-sd
          zip -r "../LCSNative-switch-${{ steps.version.outputs.version }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: LCSNative-switch-${{ steps.version.outputs.version }}
          path: out/switch-sd/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: LCSNative-map-${{ steps.version.outputs.version }}
          path: |
            out/lcs-switch/lcs/LCSNative.map
            out/lcs-switch/lcs/LCSNative.elf
          if-no-files-found: warn
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/LCSNative-switch-${{ steps.version.outputs.version }}.zip
          prerelease: true
          body: |
            Nintendo Switch build (Atmosphere homebrew). Extract the zip to the
            root of the SD card, then put your own game files in
            `switch/LCSNative/game/` (see `switch/LCSNative/README.txt`).

  gl-backend:
    name: Desktop tests (OpenGL GE, settings panel, save list, allocator)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config \
            libsdl2-dev libvulkan-dev glslang-tools xvfb libgl1-mesa-dri \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev
      - name: Build
        run: |
          cmake -S . -B out/gl -G Ninja -DCMAKE_BUILD_TYPE=Release -DLCS_GE_OPENGL=ON
          ninja -C out/gl lcs_ge_gl_backend_test lcs_host_menu_test lcs_switch_malloc_test
      - name: Test
        run: >
          xvfb-run -a ctest --test-dir out/gl --output-on-failure
          -R "lcs_ge_gl_backend_test|lcs_host_menu_|lcs_switch_malloc_test"
