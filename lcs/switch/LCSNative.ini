; Nintendo Switch settings. The game always fills the screen.
; + and - together open the host settings panel (the PC's F10).

[Display]
ResolutionMode=Desktop
Fullscreen=true
UpscaleFilter=Bilinear
IntegerScale=false
ShowFPS=true
VSync=false
HudScale=0.75
; Original = PlayStation glyphs. Keep Original on the Switch: the PSP's
; buttons sit where the Switch's are (Cross = B, Circle = A, Square = Y,
; Triangle = X), while Xbox letters would name the wrong buttons.
ButtonPrompts=Original

[Rendering]
; OpenGL draws on the Switch GPU. Software is the CPU rasterizer, slower, but
; the reference picture; the game falls back to it if OpenGL cannot start.
Backend=OpenGL
; PSP, Scale, Custom (InternalWidth, InternalHeight).
; With OpenGL, 2 (960x544) is sharp in handheld; 3 for a TV. With Software,
; keep 1 (480x272): every extra pixel costs CPU time.
InternalResolutionMode=Scale
InternalScale=2
MSAA=1
AnisotropicFiltering=1
; -8 to 8. Negative keeps distant textures sharper.
TextureLodBias=0
; LOD and draw distance, 1 to 4. 1 is the original.
; At 2 and above, neighbouring sectors supply detailed scenery in place of nearby coarse LODs.
ViewDistance=1.00

[Widescreen]
Enabled=true
AspectRatio=auto

[Controls]
MouseSensitivity=12
CameraSmoothing=50
AutoAim=true

; Mouse and keyboard (a USB keyboard works on the Switch). Restart after editing. Names ignore case.
; Several keys: separate with commas. None clears a binding.
; Shift, Ctrl, and Alt set both sides.
; F10 opens host settings. F11 toggles fullscreen.
; Letters, digits, F1-F9, F12, Space, Enter, Escape, Tab, Backspace,
; LeftShift, RightShift, LeftCtrl, RightCtrl, LeftAlt, RightAlt,
; Up, Down, Left, Right, Numpad0-Numpad9, NumpadPlus, NumpadMinus,
; Delete, Insert, Home, End, PageUp, PageDown, Comma, Period, Minus, Equals,
; MouseLeft, MouseRight, MouseMiddle, Mouse4, Mouse5, WheelUp, WheelDown.
; On foot, Move* is the stick. In a vehicle, MoveForward accelerates,
; MoveBack brakes, MoveLeft and MoveRight steer, and Up and Down pitch.
; Sprint and Aim are not sent in a vehicle. Handbrake is.
MoveForward=W
MoveBack=S
MoveLeft=A
MoveRight=D
Walk=LeftAlt
Sprint=Space
Jump=LeftShift,RightShift
EnterVehicle=F,Enter
Attack=MouseLeft
Aim=MouseRight
CenterCamera=H,MouseMiddle
WeaponPrevious=Q,Left,WheelUp
WeaponNext=E,Right,WheelDown
Up=Up
Down=Down
Pause=Escape
Camera=V
Handbrake=Space

; Controller. Names are by position (Xbox names), as on the PSP:
;   PadA = bottom = Switch B  (PSP Cross)
;   PadB = right  = Switch A  (PSP Circle)
;   PadX = left   = Switch Y  (PSP Square)
;   PadY = top    = Switch X  (PSP Triangle)
;   Shoulders L/R, triggers ZL/ZR, Start +, Back -.
; The value is an action from the list above.
; A trigger does not send its buttons in a vehicle. MoveForward still
; accelerates and MoveBack still brakes.
; LeftStick and RightStick are Move or Camera.
; Left stick click is the horn in a vehicle.
PadA=Sprint
PadB=Attack
PadX=Jump
PadY=EnterVehicle
PadLeftShoulder=CenterCamera
PadRightShoulder=Aim
PadLeftTrigger=MoveBack,CenterCamera
PadRightTrigger=MoveForward,Aim
PadStart=Pause
PadBack=Camera
PadDpadUp=Up
PadDpadDown=Down
PadDpadLeft=WeaponPrevious
PadDpadRight=WeaponNext
PadLeftStickClick=Down
PadRightStickClick=None
LeftStick=Move
RightStick=Camera

[Timing]
; 30 or 60. The PSP game ran at 30; 60 needs much more from the Switch CPU.
FrameRate=30
; Skip the 60 Hz sleep. Used for testing.
Uncapped=false
